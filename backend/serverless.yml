service: ai-security-agent

frameworkVersion: '3'

provider:
  name: aws
  runtime: python3.9
  region: us-east-1
  iamRoleStatements:
    - Effect: Allow
      Action:
        - bedrock:InvokeModel
      Resource: "*"

functions:
  reviewCode:
    handler: src/handler.review_code
    events:
      - http:
          path: /review
          method: post
          cors: true

plugins:
  - serverless-python-requirements
  - serverless-offline

custom:
  serverless-offline:
    noPrependStageInUrl: true
  pythonRequirements:
    dockerizePip: non-linux
